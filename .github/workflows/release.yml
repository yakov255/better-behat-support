# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Builds the plugin and uploads the compiled extension to GitHub releases.

name: Release
on:
  release:
    types: [prereleased, released]

jobs:

  # Build and upload the plugin to GitHub releases
  release:
    name: Build and Upload Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # Free GitHub Actions Environment Disk Space
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      # Set up the Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      # Build the plugin
      - name: Build Plugin
        run: ./gradlew buildPlugin

      # Upload an artifact as a release asset (overwrite if already exists from draft)
      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*.zip --clobber

